name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          type-checking: true
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true

  # Type-checks, lints, tests and builds the admin custom components and the www panel.
  # Both have their own package.json and are not covered by the ioBroker testing actions.
  frontend-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [src-admin, src-www]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.project }}/package-lock.json
      # The frontends reach into the root package: prettier.config.mjs (lint) imports
      # @iobroker/eslint-config, and tests import shared modules from src/lib whose
      # tsconfig extends @tsconfig/node22. Both live in the root node_modules.
      - name: Install root dependencies
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
      # admin/custom and www are committed build output (needed for installs from GitHub and
      # published as-is by the deploy job). Fail if the committed bundle is stale.
      - name: Committed bundle is up to date
        working-directory: .
        run: |
          git status --porcelain -- admin/custom www
          test -z "$(git status --porcelain -- admin/custom www)"

  # Deploys the final package to NPM. Requires npm trusted publishing to be set up
  # for the package — see https://docs.npmjs.com/trusted-publishers.
  deploy:
    needs: [check-and-lint, adapter-tests, frontend-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create Github releases
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
