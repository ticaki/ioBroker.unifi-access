name: Auto-Merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    # Hard stop a little above max-wait-time, so a hanging run cannot block a runner for the 6 h default.
    timeout-minutes: 195

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Updates of src-admin / src-www usually change the committed bundles (admin/custom, www) and then
      # fail the check "Committed bundle is up to date" until somebody rebuilds and commits them. The
      # auto-merge action can only match on dependency and update type, not on the directory, so these
      # PRs are recognised here by their changed files (read-only API call, nothing of the PR is checked
      # out or run) and left for a manual merge instead of occupying a runner for hours.
      - name: Leave frontend updates to a manual merge
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE '^(src-admin|src-www)/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not auto-merged::This update changes src-admin/src-www. Rebuild the bundles (npm run build:admin / build:www), commit them on the PR branch and merge by hand."
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge Dependabot PRs
        if: steps.scope.outputs.frontend != 'true'
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-file-path: '.github/auto-merge.yml'
          merge-method: 'squash'
          wait-for-checks: 'true'
          # This job only polls the "Test and Release" checks of the PR and occupies a runner while doing so.
          # On 2026-11-14 the checks sat in the runner queue for up to 86 min (all 20 concurrent runners of the
          # account were busy, up to 16 of them with waiting auto-merge jobs like this one), so the former
          # limit of 3600 s expired seconds before the last check finished and the job failed with
          # "Timeout waiting for checks to complete". The main fix is the dedicated Dependabot time slot in
          # .github/dependabot.yml; the longer limit is the safety margin for a full runner queue.
          max-wait-time: '10800'
